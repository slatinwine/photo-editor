<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#98958c">
<title>照片编辑</title>
<style>
/* ============ 清水混凝土 · Fair-Faced Concrete ============ */
:root{
  /* 主色克制为两组：暖灰混凝土 + 墨色，锈红仅作点睛 */
  --ink:#33322e; --ink2:#6e6c66; --ink3:#98958d;
  --paper:#f0efe9;
  --line:rgba(42,40,35,.20); --line-l:rgba(255,255,255,.55);
  --slab-hi:220,218,212; --slab-lo:199,196,190;
  --wall:#98958c;
  --chip:rgba(40,38,34,.92);
  --accent:#8f5744;
  --t2:var(--ink2); --t3:var(--ink3);          /* 兼容旧引用 */
  --blue:var(--ink); --red:var(--accent); --yellow:#a49340;
  --radius:6px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Noto Serif SC","STSong","SimSun",serif;
  --mono:Consolas,"Cascadia Mono","SF Mono",Menlo,monospace;
  --noise:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.2 0 0 0 0 0.2 0 0 0 0 0.18 0 0 0 0.5 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  --slab:linear-gradient(180deg,rgba(var(--slab-hi),.94),rgba(var(--slab-lo),.96));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--wall);color:var(--ink);overflow:hidden;
  font-family:var(--sans);
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
svg{display:block}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative}

/* ============ 顶部导航 ============ */
#topbar{
  display:none;align-items:center;gap:2px;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:var(--slab),var(--noise),#cbc8c2;
  box-shadow:inset 0 1px 0 var(--line-l);
  border-bottom:1px solid var(--line);z-index:30;position:relative;
}
body.editing #topbar{display:flex}
#topTitle{flex:1;text-align:center;font-family:var(--serif);font-size:17px;font-weight:400;letter-spacing:.14em;
  line-height:1.15;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topTitle small{display:block;font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.22em;color:var(--ink3)}
.tbtn{color:var(--ink);font-size:16px;padding:6px 10px;border-radius:4px;flex:none}
.tbtn:active{opacity:.45}
.tbtn:disabled{opacity:.28;pointer-events:none}
.tbtn.icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;padding:0}
.tbtn.done{font-weight:700}

/* ============ 画布区 ============ */
#stage{flex:1;min-height:0;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 26%,rgba(255,255,255,.14),rgba(0,0,0,0) 55%),
    radial-gradient(circle at 50% 110%,rgba(0,0,0,.22),rgba(0,0,0,0) 60%),
    var(--noise),
    var(--wall);
  touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);will-change:transform}
#cv{display:block;box-shadow:0 8px 30px rgba(30,28,24,.4),0 2px 8px rgba(30,28,24,.3)}
#warmLayer{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:0}
#textLayer,#cropLayer{position:absolute;inset:0}
#textLayer{pointer-events:none}
#cropLayer{display:none;pointer-events:none}

/* 文字对象 */
.text-obj{position:absolute;pointer-events:auto;touch-action:none}
.text-obj .t-body{white-space:pre;text-align:center;line-height:1.22}
.text-obj.sel{outline:1.5px dashed rgba(255,255,255,.85);outline-offset:8px;border-radius:2px}
.t-btn{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--chip);
  backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;color:var(--paper);
  box-shadow:0 2px 10px rgba(0,0,0,.5)}
.text-obj.sel .t-btn{display:flex}
.t-del{left:-42px;top:-16px}
.t-resize{right:-42px;bottom:-16px}
.t-btn:active{transform:scale(.9)}
.text-obj{transform-origin:center}

/* 裁剪层 */
#cropBox{position:absolute;border:1.5px solid rgba(255,255,255,.95);pointer-events:auto;touch-action:none;cursor:move}
.cs{position:absolute;background:rgba(0,0,0,.55);pointer-events:none}
#cropBox .g{position:absolute;background:rgba(255,255,255,.4)}
#cropBox .g.v{width:1px;height:100%;top:0}#cropBox .g.h{height:1px;width:100%;left:0}
.ch{position:absolute;pointer-events:auto;touch-action:none}
.ch.c{width:30px;height:30px}
.ch.c::before{content:"";position:absolute;inset:0;border:0 solid #fff;border-width:0}
.ch.nw{left:-2px;top:-2px}.ch.ne{right:-2px;top:-2px}.ch.sw{left:-2px;bottom:-2px}.ch.se{right:-2px;bottom:-2px}
.ch.nw::before{border-left-width:3.5px;border-top-width:3.5px;border-top-left-radius:4px}
.ch.ne::before{border-right-width:3.5px;border-top-width:3.5px;border-top-right-radius:4px}
.ch.sw::before{border-left-width:3.5px;border-bottom-width:3.5px;border-bottom-left-radius:4px}
.ch.se::before{border-right-width:3.5px;border-bottom-width:3.5px;border-bottom-right-radius:4px}
.ch.e{right:-9px;top:20%;height:60%;width:20px;cursor:ew-resize}
.ch.w{left:-9px;top:20%;height:60%;width:20px;cursor:ew-resize}
.ch.n{top:-9px;left:20%;width:60%;height:20px;cursor:ns-resize}
.ch.s{bottom:-9px;left:20%;width:60%;height:20px;cursor:ns-resize}

/* 模式提示 */
#hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:none;
  background:var(--chip);padding:7px 14px;border-radius:3px;
  border:1px solid rgba(255,255,255,.08);
  font-size:12.5px;color:#e6e4dd;z-index:20;white-space:nowrap}

/* ============ 底部 ============ */
#bottombar{
  background:var(--slab),var(--noise),#cbc8c2;
  box-shadow:inset 0 1px 0 var(--line-l);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:30;position:relative;
}
#mainTools{display:flex}
.tool{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 0 12px;color:var(--ink);font-size:10.5px;letter-spacing:.08em;
}
.tool svg{width:25px;height:25px}
.tool:active{opacity:.5}
.tool.on{color:var(--accent);font-weight:600}

.toolPanel{display:none;flex-direction:column;min-height:158px;padding:10px 14px 8px;gap:10px}
.toolPanel.show{display:flex}
.panelActions{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.panelActions .mid{display:flex;gap:6px}
.pbtn{width:44px;height:38px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  color:var(--ink);border:1px solid var(--line);
  background:linear-gradient(180deg,#dad8d2,#cbc8c2);
  box-shadow:inset 0 1px 0 var(--line-l)}
.pbtn.primary{color:var(--paper);border-color:rgba(0,0,0,.3);
  background:linear-gradient(180deg,#4c4a44,#38362f);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.pbtn:active{opacity:.55}
.pbtn svg{width:19px;height:19px}

/* 分段控件 */
.seg{display:flex;background:rgba(42,40,35,.14);border-radius:4px;padding:2px;gap:2px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.seg button{flex:1;padding:6px 4px;border-radius:3px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:linear-gradient(180deg,#4c4a44,#38362f);color:var(--paper);font-weight:600;
  box-shadow:0 1px 2px rgba(0,0,0,.3)}
.seg.scroll{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.seg.scroll button{flex:0 0 auto;padding:6px 13px}

/* 滑条行 */
.sliderRow{display:flex;align-items:center;gap:12px}
.sliderRow .val{width:44px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(42,40,35,.30);
  box-shadow:inset 0 1px 1px rgba(0,0,0,.25),0 1px 0 var(--line-l)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:linear-gradient(180deg,#d8d6d0,#b7b4ad);border:1px solid rgba(42,40,35,.4);
  box-shadow:0 1px 5px rgba(0,0,0,.35);margin-top:-11px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(42,40,35,.30)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:1px solid rgba(42,40,35,.4);border-radius:50%;
  background:linear-gradient(180deg,#d8d6d0,#b7b4ad);box-shadow:0 1px 5px rgba(0,0,0,.35)}

/* 颜色点 */
.dots{display:flex;gap:14px;align-items:center;justify-content:center;padding:2px 0}
.dot{width:27px;height:27px;border-radius:50%;border:2px solid rgba(42,40,35,.35);flex:none}
.dot.on{border-color:var(--ink);transform:scale(1.15);box-shadow:0 0 0 2px rgba(255,255,255,.6) inset}
.dot:active{transform:scale(.9)}

/* 调整横滑项 */
.hscroll{display:flex;gap:18px;overflow-x:auto;padding:6px 8px 2px;scrollbar-width:none;justify-content:flex-start}
.hscroll::-webkit-scrollbar{display:none}
.hitem{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--ink2);flex:none;min-width:44px;letter-spacing:.06em}
.hitem svg{width:26px;height:26px}
.hitem.on{color:var(--accent);font-weight:600}
.hitem:active{opacity:.6}

/* 滤镜缩略 */
.thumbs{display:flex;gap:12px;overflow-x:auto;padding:8px 10px 4px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--ink2)}
.thumb .im{position:relative;width:64px;height:64px;border-radius:2px;overflow:hidden;background:#c6c3bd;
  box-shadow:0 1px 3px rgba(0,0,0,.25)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tt{position:absolute;inset:0;mix-blend-mode:soft-light;pointer-events:none}
.thumb.on .im{outline:2.5px solid var(--accent);outline-offset:1px}
.thumb.on{color:var(--ink);font-weight:600}
.thumb:active .im{opacity:.7}

/* ============ 欢迎页 ============ */
#welcome{position:absolute;inset:0;z-index:40;
  background:
    radial-gradient(circle at 50% 24%,rgba(255,255,255,.12),rgba(0,0,0,0) 55%),
    var(--noise),
    var(--wall);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;padding:24px;text-align:center}
#welcome.hide{display:none}
#welcome .logo{width:86px;height:86px;border-radius:8px;
  background:linear-gradient(145deg,#e3e1db,#c6c3bc 60%,#b3b0a8);
  border:1px solid rgba(42,40,35,.25);
  box-shadow:inset 0 1px 0 var(--line-l),inset 0 -2px 0 rgba(0,0,0,.12),0 10px 30px rgba(30,28,24,.35);
  position:relative;
  display:flex;align-items:center;justify-content:center;margin-bottom:22px}
#welcome .logo::after{content:"";position:absolute;inset:0;border-radius:8px;background-image:var(--noise);opacity:.5;pointer-events:none}
#welcome .logo svg{width:44px;height:44px;color:var(--ink2)}
#welcome h1{font-family:var(--serif);font-size:27px;font-weight:400;letter-spacing:.3em;padding-left:.3em;margin-bottom:8px}
#welcome p{font-size:13.5px;color:var(--ink2);margin-bottom:34px;max-width:280px;line-height:1.6}
.dropZone{width:min(84vw,320px);border:1.5px dashed rgba(42,40,35,.45);border-radius:4px;
  padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink2);
  font-size:13px;transition:.2s;margin-bottom:18px;background:rgba(255,255,255,.12)}
.dropZone.over{border-color:var(--accent);background:rgba(143,87,68,.08);color:var(--accent)}
.bigBtn{width:min(84vw,320px);padding:15px;border-radius:4px;font-size:16px;font-weight:600;letter-spacing:.24em;padding-left:calc(15px + .24em);
  color:var(--paper);border:1px solid rgba(0,0,0,.3);
  background:linear-gradient(180deg,#4c4a44,#38362f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 6px rgba(30,28,24,.3);
  display:flex;align-items:center;justify-content:center;gap:8px}
.bigBtn:active{opacity:.75}
.ghostBtn{width:min(84vw,320px);padding:13px;border-radius:4px;font-size:15px;letter-spacing:.14em;
  color:var(--ink);border:1px solid var(--line);
  background:linear-gradient(180deg,#dad8d2,#cbc8c2);box-shadow:inset 0 1px 0 var(--line-l)}
.ghostBtn:active{opacity:.6}
#welcome .feat{display:flex;gap:26px;margin-top:30px;color:var(--ink3);font-size:11px;letter-spacing:.1em}
#welcome .feat span{display:flex;flex-direction:column;align-items:center;gap:6px}
#welcome .feat svg{width:21px;height:21px;color:var(--ink2)}

/* ============ Sheet / Alert / Toast ============ */
.mask{position:fixed;inset:0;background:rgba(25,24,21,.5);z-index:60;opacity:0;visibility:hidden;transition:.3s}
.mask.show{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;transform:translateY(105%);
  transition:transform .38s cubic-bezier(.32,.72,0,1);
  padding:0 10px calc(env(safe-area-inset-bottom) + 10px)}
.sheet.show{transform:translateY(0)}
.sheet .grp{border-radius:6px;overflow:hidden;
  background:var(--slab),var(--noise),#cbc8c2;
  border:1px solid var(--line);
  box-shadow:0 8px 30px rgba(25,24,21,.4)}
.sheet .grp+.grp{margin-top:9px}
.sheet button.si{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;
  padding:16px;font-size:16px;color:var(--ink);position:relative}
.sheet button.si:active{background:rgba(42,40,35,.08)}
.sheet button.si+.si::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--line)}
.sheet button.si.destructive{color:var(--accent);font-weight:600}
.sheet button.si svg{width:19px;height:19px}
.sheet .cancel{margin-top:9px;border-radius:6px;border:1px solid var(--line);
  background:var(--slab),var(--noise),#cbc8c2;font-weight:600}
.sheet .cancel button{width:100%;padding:16px;font-size:16px}

#textSheet{position:fixed;left:0;right:0;bottom:0;z-index:62;transform:translateY(105%);
  transition:transform .38s cubic-bezier(.32,.72,0,1);
  background:var(--slab),var(--noise),#cbc8c2;
  border-radius:8px 8px 0 0;border-top:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--line-l),0 -8px 30px rgba(25,24,21,.35);
  padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:12px}
#textSheet.show{transform:translateY(0)}
#textSheet::before{content:"";width:38px;height:5px;border-radius:2px;
  background:rgba(42,40,35,.3);margin:0 auto 2px}
#textSheet header{display:flex;align-items:center;justify-content:space-between}
#textSheet header b{font-family:var(--serif);font-size:16.5px;font-weight:400;letter-spacing:.18em}
#textSheet header .tbtn{padding:4px 8px}
#tInput{width:100%;min-height:84px;background:#c2bfb9;border:1px solid var(--line);border-radius:4px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.15);
  color:var(--ink);font-size:17px;padding:12px 14px;resize:none;outline:none;font-family:inherit;
  -webkit-user-select:text;user-select:text}
#tInput::placeholder{color:var(--ink3)}
.trow{display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px}
.trow::-webkit-scrollbar{display:none}
.trow .lbl{font-size:12.5px;color:var(--ink2);flex:none}
.fontChip{flex:none;padding:8px 16px;border-radius:4px;border:1.5px solid var(--line);
  background:linear-gradient(180deg,#dad8d2,#cbc8c2);font-size:15px;color:var(--ink)}
.fontChip.on{border-color:var(--accent)}
.toggleRow{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--ink2)}
.switch{position:relative;width:51px;height:31px;border-radius:16px;background:rgba(42,40,35,.28);transition:.25s;flex:none}
.switch.on{background:linear-gradient(180deg,#4c4a44,#38362f)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:linear-gradient(180deg,#eceae4,#c9c6c0);box-shadow:0 2px 5px rgba(0,0,0,.3);transition:.25s}
.switch.on::after{left:22px}

#alertBox{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(25,24,21,.5)}
#alertBox.show{display:flex}
#alertBox .card{width:280px;border-radius:6px;overflow:hidden;
  background:var(--slab),var(--noise),#cbc8c2;
  border:1px solid var(--line);
  box-shadow:0 10px 40px rgba(25,24,21,.45);
  text-align:center;animation:pop .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(1.12);opacity:0}}
#alertBox .card .tt{padding:19px 18px 4px;font-family:var(--serif);font-size:16.5px;font-weight:400;letter-spacing:.1em}
#alertBox .card .msg{padding:4px 18px 18px;font-size:13.5px;color:var(--ink2);line-height:1.45}
#alertBox .card button{display:block;width:100%;padding:13px;font-size:16px;color:var(--accent);position:relative}
#alertBox .card button+button::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--line)}
#alertBox .card button.dg{color:var(--accent);font-weight:700}
#alertBox .card button:active{background:rgba(42,40,35,.08)}

#toast{position:fixed;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translate(-50%,-16px);
  background:var(--chip);border:1px solid rgba(255,255,255,.08);
  padding:9px 18px;border-radius:3px;
  font-size:13.5px;color:#e6e4dd;z-index:80;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;max-width:86vw;
  overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}

#busy{position:fixed;inset:0;z-index:75;display:none;align-items:center;justify-content:center;background:rgba(25,24,21,.4)}
#busy.show{display:flex}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(240,239,233,.3);border-top-color:#f0efe9;
  animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (min-width:700px){
  .tool{padding:11px 0 13px}
  #mainTools{max-width:560px;margin:0 auto}
  .toolPanel{max-width:640px;margin:0 auto;width:100%}
}
</style>

</head>
<body class="fit">

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="i-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="9" cy="9" r="1.9"/>
      <path d="M4 17.5 9.2 12.6l4.2 3.9 2.8-2.6L20.5 17.5"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="4.5"/><circle cx="9" cy="9" r="1.9"/>
      <path d="M4 17.5 9.2 12.6l4.2 3.9 2.8-2.6L20.5 17.5"/>
    </symbol>
    <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 4.5 4 9l4.5 4.5"/><path d="M4 9h10.2a5.4 5.4 0 0 1 0 10.8H9"/>
    </symbol>
    <symbol id="i-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

<script>
'use strict';
/* ================= 基础引用 ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const stage=$('#stage'), wrap=$('#wrap'), cv=$('#cv'), ctx=cv.getContext('2d');
const textLayer=$('#textLayer'), warmLayer=$('#warmLayer');
const cropLayer=$('#cropLayer'), cropBox=$('#cropBox'), cropShade=$('#cropShade');

const BASE_MAX=2400;          // 基准分辨率（长边）
const HIST_MAX=6;             // 历史栈深
const FONTS=[
  "-apple-system,'PingFang SC','Helvetica Neue',sans-serif",
  "Georgia,'Songti SC','SimSun',serif",
  "'Yuanti SC','YouYuan','Comic Sans MS',cursive",
  "'Xingkai SC','KaiTi','STKaiti',serif"
];
const COLORS=['#FFFFFF','#000000','#FF453A','#FF9F0A','#FFD60A','#30D158','#0A84FF','#BF5AF2','#FF375F'];

const S={
  ready:false, mode:'none',
  W:0,H:0,
  hist:[], redo:[],
  texts:[], sel:null, seq:1,
  brushColor:'#FFFFFF',
  retouchTool:'mosaic',
  adj:{b:0,c:0,s:0,w:0}, adjSave:null, adjItem:'b',
  filterIdx:0, filterSave:0, filterTint:null,
  cropLock:0, cropOrigin:null,
  effect:null,
  base:null,      // 原图备份（消除工具的填充源）
  drawing:false,
};
const V={s:1,tx:0,ty:0};               // 视图变换
const ptrs=new Map();                   // 活跃指针
let pinch=null, downInfo=null, lastTap=0, lastTapXY=[0,0], busyFlag=false;
let thumbURL='';

/* ================= 工具函数 ================= */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};

function toast(msg,ms=1900){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms);
}
function confirmBox(title,okText,onOk,destructive=true,msg=''){
  $('#alTitle').textContent=title;
  const m=$('#alMsg'); if(msg){m.textContent=msg;m.style.display='block'}else m.style.display='none';
  const ok=$('#alOk'); ok.textContent=okText;
  ok.className=destructive?'dg':'';
  ok.onclick=()=>{hideAlert();onOk()};
  $('#alCancel').onclick=hideAlert;
  $('#alertBox').classList.add('show');
}
function hideAlert(){$('#alertBox').classList.remove('show')}
function busy(on){busyFlag=on;$('#busy').classList.toggle('show',on)}

function setView(s=1,tx=0,ty=0){
  V.s=s;V.tx=tx;V.ty=ty;
  wrap.style.transform=`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${s})`;
}
function fitView(){setView()}

/* 画布适配：显式计算显示尺寸（bottombar 高度随面板变化，CSS 无法可靠表达） */
function layoutStage(){
  if(!S.ready)return;
  const pad=22;
  const aw=Math.max(40,stage.clientWidth-pad), ah=Math.max(40,stage.clientHeight-pad);
  const k=Math.min(aw/S.W,ah/S.H);
  cv.style.width=Math.floor(S.W*k)+'px';
  cv.style.height=Math.floor(S.H*k)+'px';
}

/* 屏幕 → 画布坐标 */
function toCanvas(clientX,clientY){
  const r=cv.getBoundingClientRect();
  return {x:(clientX-r.left)/r.width*S.W, y:(clientY-r.top)/r.height*S.H};
}
const dispW=()=>cv.getBoundingClientRect().width;
const dispH=()=>cv.getBoundingClientRect().height;

/* ================= 历史 ================= */
function pushHistory(){
  const url=cv.toDataURL('image/png');
  S.hist.push(url);
  if(S.hist.length>HIST_MAX+1)S.hist.shift();
  S.redo.length=0;
  updateHistBtns();
}
function updateHistBtns(){
  $('#btnUndo').disabled=S.hist.length<=1||busyFlag;
  $('#btnRedo').disabled=S.redo.length===0||busyFlag;
}
function loadSnap(url){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      S.W=img.naturalWidth;S.H=img.naturalHeight;
      cv.width=S.W;cv.height=S.H;
      ctx.drawImage(img,0,0);
      S.effect=null;
      fitView();layoutStage();refreshTexts();updateMeta();
      res();
    };
    img.src=url;
  });
}
/* 撤销/还原前退出预览模式，避免预览状态与画布内容错位 */
function safeResetMode(){

}
async function undo(){

    g.lineTo(x0+w*.22,h*.72-hh);g.lineTo(x0+w*.46,h*.72);g.closePath();g.fill()};
  mount(-80,300,'#2b3a55');mount(w*.30,240,'#37486a');mount(w*.55,340,'#22304a');

function startEdit(img){
  const scale=Math.min(1,BASE_MAX/Math.max(img.naturalWidth,img.naturalHeight));
  S.W=Math.round(img.naturalWidth*scale);S.H=Math.round(img.naturalHeight*scale);
  cv.width=S.W;cv.height=S.H;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,0,0,S.W,S.H);
  S.base=makeCanvas(S.W,S.H);
  S.base.getContext('2d').drawImage(img,0,0,S.W,S.H);
  S.texts=[];S.sel=null;S.hist=[];S.redo=[];S.effect=null;
  S.adj={b:0,c:0,s:0,w:0};S.filterIdx=0;S.filterTint=null;
  renderAllTexts();setMode('none');updateWarm();
  pushHistory();

  $('#welcome').classList.add('hide');
  fitView();layoutStage();updateMeta();updateHistBtns();
}
function updateMeta(){ $('#imgMeta').textContent=`${S.W} × ${S.H}` }

/* ================= 模式切换 ================= */
const PANELS={brush:'#pBrush',retouch:'#pRetouch',text:'#pText',crop:'#pCrop',adjust:'#pAdjust',filter:'#pFilter'};
function setMode(m){
  if(!S.ready&&m!=='none')return;
  // 离开旧模式清理
  if(S.mode==='adjust'&&S.adjSave)cancelAdjust();
  if(S.mode==='filter')cancelFilter();
  if(S.mode==='crop')exitCrop(false);
  deselectText();
  S.mode=m;
  $$('#mainTools .tool').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  $$('.toolPanel').forEach(p=>p.classList.remove('show'));
  $('#mainTools').style.display=(m==='none')?'flex':'none';
  if(PANELS[m])$(PANELS[m]).classList.add('show');
  const hint=$('#hint');
  if(m==='text'){hint.textContent='点按照片添加文字 · 拖动可平移';hint.style.display='block'}
  else if(m==='retouch'){hint.textContent=S.retouchTool==='eraser'?'涂抹以擦除前景，自动填充原图背景':'涂抹以遮挡该区域';hint.style.display='block'}
  else hint.style.display='none';
  if(m==='crop')enterCrop();
  if(m==='filter'){openFilter()}
  if(m==='adjust'){openAdjust()}
  if(m!=='crop'&&m!=='adjust'&&m!=='filter')fitView();
  if(m==='brush'||m==='retouch')fitView();
  requestAnimationFrame(layoutStage);
}

/* ================= 笔刷引擎（画笔 / 马赛克 / 模糊 / 消除） ================= */
let effectC=null;
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

function downscaleBlur(src,strength){ // ctx.filter 不可用时的降采样近似
  const k=1/strength, t=makeCanvas(Math.max(2,Math.round(S.W*k)),Math.max(2,Math.round(S.H*k)));
  const tc=t.getContext('2d');tc.drawImage(src,0,0,t.width,t.height);
  const o=makeCanvas(S.W,S.H);const oc=o.getContext('2d');
  oc.imageSmoothingEnabled=true;oc.drawImage(t,0,0,S.W,S.H);
  return o;
}
function buildEffect(type){
  const W=S.W,H=S.H;
  const e=makeCanvas(W,H), ec=e.getContext('2d');
  if(type==='mosaic'){
    const tw=Math.max(12,Math.round(W/46)), th=Math.max(9,Math.round(H/46));
    const t=makeCanvas(tw,th);const tc=t.getContext('2d');
    tc.drawImage(cv,0,0,tw,th);
    ec.imageSmoothingEnabled=false;
    ec.drawImage(t,0,0,W,H);
  }else if(type==='blur'){
    const r=Math.max(4,Math.round(W/48));
    ec.drawImage(cv,0,0); // 打底防边缘透明
    if(typeof ec.filter==='string'){
      ec.filter=`blur(${r}px)`;ec.drawImage(cv,0,0);ec.filter='none';
    }else{
      ec.drawImage(downscaleBlur(cv,r/2),0,0);
    }
  }else if(type==='eraser'){
    // 消除：填充源为原图背景（擦掉前景，自动还原成原图内容）
    if(S.base)ec.drawImage(S.base,0,0,W,H);
    else ec.drawImage(cv,0,0);
  }
  return e;
}
function brushSizePx(v,min,max){return min+(max-min)*v/100}

function strokeAt(p,last,type,size){
  const e=S.effect||(S.effect=buildEffect(type));
  // 用效果图作为笔刷纹理：图案锚定在画布原点，与 drawImage(e,0,0) 逐像素对齐。
  // 旧实现先 stroke()（未设 strokeStyle，默认黑）再 clip() 线段路径——线段无填充面积，
  // 裁剪区为空，效果图画不上，拖动时只留下黑色线条，这正是「擦除/模糊变黑」的根因。
  const pat=ctx.createPattern(e,'no-repeat');
  if(!pat)return;
  ctx.save();
  ctx.beginPath();
  if(last&&(last.x!==p.x||last.y!==p.y)){
    ctx.strokeStyle=pat;ctx.lineWidth=size*2;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
  }else{
    ctx.fillStyle=pat;
    ctx.arc(p.x,p.y,Math.max(1,size),0,7);ctx.fill();
  }
  ctx.restore();
}
function drawBrushAt(p,last){
  const v=+$('#brushSize').value;
  const size=brushSizePx(v,S.W/220,S.W/14);
  ctx.save();
  ctx.strokeStyle=ctx.fillStyle=S.brushColor;
  if(last&&(last.x!==p.x||last.y!==p.y)){
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);
    ctx.lineWidth=size*2;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  }else{
    ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,size),0,7);ctx.fill();
  }
  ctx.restore();
}
let lastPt=null, stroked=false;
function beginStroke(p,type){
  if(type==='brush'){drawBrushAt(p,null);stroked=true;return}
  S.effect=null;S.effectType=type;
  strokeAt(p,null,type,sizeOfTool());stroked=true;
}
function moveStroke(p,type){
  if(type==='brush')drawBrushAt(p,lastPt);
  else strokeAt(p,lastPt,type,sizeOfTool());
}
function sizeOfTool(){
  if(S.mode==='brush')return brushSizePx(+$('#brushSize').value,S.W/220,S.W/14);
  return brushSizePx(+$('#retouchSize').value,S.W/160,S.W/10);
}
function endStroke(){
  if(stroked){pushHistory();stroked=false}
  S.effect=null;lastPt=null;
}

/* ================= 裁剪 / 旋转 ================= */
const CS={l:0,t:0,w:0,h:0};
function enterCrop(){
  fitView();layoutStage();
  cropLayer.style.display='block';
  if(S.cropLock>0){setCropRatio(S.cropLock);return}
  const w=dispW(),h=dispH();
  Object.assign(CS,{l:w*.07,t:h*.07,w:w*.86,h:h*.86});
  layoutCrop();
}
function exitCrop(restore=true){
  cropLayer.style.display='none';
  if(restore)fitView();
}
function layoutCrop(){
  cropBox.style.left=CS.l+'px';cropBox.style.top=CS.t+'px';
  cropBox.style.width=CS.w+'px';cropBox.style.height=CS.h+'px';
  const W=dispW(),H=dispH(),b=CS.t+CS.h,r=CS.l+CS.w;
  const sh=(el,x,y,w,h)=>{el.style.left=x+'px';el.style.top=y+'px';el.style.width=Math.max(0,w)+'px';el.style.height=Math.max(0,h)+'px'};
  sh($('#csT'),0,0,W,CS.t); sh($('#csB'),0,b,W,H-b);
  sh($('#csL'),0,CS.t,CS.l,CS.h); sh($('#csR'),r,CS.t,W-r,CS.h);
}
function setCropRatio(r){ // r=w/h, 0=自由
  S.cropLock=r;
  if(!r)return;
  const w=dispW(),h=dispH();
  let cw=Math.min(w*.86,w),chh=cw/r;
  if(chh>h*.86){chh=h*.86;cw=chh*r}
  Object.assign(CS,{l:(w-cw)/2,t:(h-chh)/2,w:cw,h:chh});
  layoutCrop();
}
/* 裁剪手柄拖动（含比例锁定） */
$$('.ch').forEach(h=>{
  h.addEventListener('pointerdown',e=>{
    e.stopPropagation();e.preventDefault();
    const key=h.dataset.h, o={...CS}, sx=e.clientX, sy=e.clientY;
    const dw=dispW(),dh=dispH(),min=36,r=S.cropLock;
    const mv=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      let {l,t,w,h:hh}={...o};
      if(key.includes('w')){l=clamp(o.l+dx,0,o.l+o.w-min);w=o.l+o.w-l}
      if(key.includes('e')){w=clamp(o.w+dx,min,dw-o.l)}
      if(key.includes('n')){t=clamp(o.t+dy,0,o.t+o.h-min);hh=o.t+o.h-t}
      if(key.includes('s')){hh=clamp(o.h+dy,min,dh-o.t)}
      if(r){ // 锁定 w/h = r，出界时换主导轴反推
        let W1=w,H1=w/r;
        const maxW=key.includes('w')?o.l+o.w:dw-o.l;
        const maxH=key.includes('n')?o.t+o.h:dh-o.t;
        if(key==='n'||key==='s'){W1=hh*r;H1=hh;if(W1>maxW){W1=maxW;H1=W1/r}}
        else{
          if(H1>maxH){H1=maxH;W1=H1*r}
          if(W1>maxW){W1=maxW;H1=W1/r}
        }
        W1=Math.max(min,W1);H1=Math.max(min,W1/r);
        l=key.includes('e')?o.l:o.l+o.w-W1;
        t=key.includes('s')?o.t:o.t+o.h-H1;
        if(key==='n'||key==='s'){l=clamp(o.l+(o.w-W1)/2,0,Math.max(0,dw-W1))}
        else if(key==='e'||key==='w'){t=clamp(o.t+(o.h-H1)/2,0,Math.max(0,dh-H1))}
        w=W1;hh=H1;
      }
      CS.l=l;CS.t=t;CS.w=w;CS.h=hh;layoutCrop();
    };
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
});
/* 裁剪框整体拖动 */
cropBox.addEventListener('pointerdown',e=>{
  if(e.target.closest('.ch'))return;
  e.stopPropagation();e.preventDefault();
  const o={...CS},sx=e.clientX,sy=e.clientY,dw=dispW(),dh=dispH();
  const mv=ev=>{
    CS.l=clamp(o.l+ev.clientX-sx,0,dw-CS.w);
    CS.t=clamp(o.t+ev.clientY-sy,0,dh-CS.h);
    layoutCrop();
  };
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
});
function applyCrop(){
  const sx=Math.round(CS.l/dispW()*S.W), sy=Math.round(CS.t/dispH()*S.H);
  const sw=Math.round(CS.w/dispW()*S.W), sh=Math.round(CS.h/dispH()*S.H);
  if(sw<8||sh<8){toast('裁剪区域太小');return}
  const nc=makeCanvas(sw,sh);
  nc.getContext('2d').drawImage(cv,sx,sy,sw,sh,0,0,sw,sh);
  if(S.base){const nb=makeCanvas(sw,sh);nb.getContext('2d').drawImage(S.base,sx,sy,sw,sh,0,0,sw,sh);S.base=nb}
  S.W=sw;S.H=sh;cv.width=sw;cv.height=sh;
  ctx.drawImage(nc,0,0);
  S.effect=null;pushHistory();
  exitCrop();setMode('none');
  toast('已裁剪');
}
/* 旋转 / 翻转（同步变换文字） */
function rotate90(dir){ // 1=顺时针
  const nc=makeCanvas(S.H,S.W),g=nc.getContext('2d');
  if(dir>0){g.translate(S.H,0);g.rotate(Math.PI/2)}
  else{g.translate(0,S.W);g.rotate(-Math.PI/2)}
  g.drawImage(cv,0,0);
  if(S.base){
    const nb=makeCanvas(S.H,S.W),g2=nb.getContext('2d');
    if(dir>0){g2.translate(S.H,0);g2.rotate(Math.PI/2)}
    else{g2.translate(0,S.W);g2.rotate(-Math.PI/2)}
    g2.drawImage(S.base,0,0);
    S.base=nb;
  }
  cv.width=S.H;cv.height=S.W;
  [S.W,S.H]=[S.H,S.W];
  ctx.drawImage(nc,0,0);
  S.texts.forEach(t=>{
    const nx=dir>0?1-t.y:t.y, ny=dir>0?t.x:1-t.x;
    t.x=nx;t.y=ny;t.rot=(t.rot+90*dir)%360;
  });
  S.effect=null;pushHistory();refreshTexts();fitView();
}
function flip(axis){ // 'h'|'v'
  const nc=makeCanvas(S.W,S.H),g=nc.getContext('2d');
  if(axis==='h'){g.translate(S.W,0);g.scale(-1,1)}
  else{g.translate(0,S.H);g.scale(1,-1)}
  g.drawImage(cv,0,0);
  if(S.base){
    const nb=makeCanvas(S.W,S.H),g2=nb.getContext('2d');
    if(axis==='h'){g2.translate(S.W,0);g2.scale(-1,1)}
    else{g2.translate(0,S.H);g2.scale(1,-1)}
    g2.drawImage(S.base,0,0);
    S.base=nb;
  }
  ctx.clearRect(0,0,S.W,S.H);ctx.drawImage(nc,0,0);
  S.texts.forEach(t=>{
    if(axis==='h'){t.x=1-t.x}else{t.y=1-t.y}
    t.rot=-t.rot;
  });
  S.effect=null;pushHistory();refreshTexts();
}

/* ================= 调整 ================= */
function adjFilterCSS(a){
  const f=[];
  if(a.b)f.push(`brightness(${(1+a.b/160).toFixed(3)})`);
  if(a.c)f.push(`contrast(${(1+a.c/150).toFixed(3)})`);
  if(a.s)f.push(`saturate(${(1+a.s/100).toFixed(3)})`);
  return f.join(' ')||'none';
}
function tintCSS(a){
  if(!a.w)return null;
  const al=Math.abs(a.w)/100*.3;
  return a.w>0?`rgba(255,140,60,${al})`:`rgba(60,140,255,${al})`;
}
function updateWarm(extra){ // extra: 滤镜预览 tint
  const t=tintCSS(S.adj);
  let bg=t, op=0;
  if(t){op=1}
  if(extra){bg=extra;op=1}
  warmLayer.style.background=bg||'transparent';
  warmLayer.style.opacity=op;
}
function previewAdjust(){
  cv.style.filter=adjFilterCSS(S.adj);
  updateWarm(S.filterTint);
  $('#adjSlider').value=S.adj[S.adjItem];
  $('#adjVal').textContent=(S.adj[S.adjItem]>0?'+':'')+S.adj[S.adjItem];
}
function openAdjust(){
  S.adjSave={...S.adj};
  S.adjItem='b';
  $$('#adjItems .hitem').forEach(b=>b.classList.toggle('on',b.dataset.k==='b'));
  previewAdjust();
}
function cancelAdjust(){
  if(!S.adjSave)return;
  S.adj={...S.adjSave};S.adjSave=null;
  cv.style.filter='none';updateWarm(S.filterTint);
}
function applyAdjust(){
  const a=S.adj;
  const has=a.b||a.c||a.s||a.w;
  S.adjSave=null;
  if(!has){cv.style.filter='none';updateWarm(null);return}
  const nc=makeCanvas(S.W,S.H),g=nc.getContext('2d');
  if(typeof g.filter==='string')g.filter=adjFilterCSS(a);
  g.drawImage(cv,0,0);
  g.filter='none';
  const t=tintCSS(a);
  if(t){
    g.save();g.globalCompositeOperation='soft-light';
    g.fillStyle=t;g.fillRect(0,0,S.W,S.H);g.restore();
  }
  cv.width=S.W;cv.height=S.H;
  ctx.drawImage(nc,0,0);
  S.adj={b:0,c:0,s:0,w:0};S.effect=null;
  cv.style.filter='none';updateWarm(null);
  pushHistory();
  toast('已应用调整');
}

/* ================= 滤镜 ================= */
const PRESETS=[
  {name:'原图',f:'',t:null},
  {name:'鲜明',f:'saturate(1.4) contrast(1.18) brightness(1.04)',t:null},
  {name:'自然',f:'brightness(1.08) saturate(1.06) contrast(1.02)',t:null},
  {name:'胶片',f:'contrast(1.16) saturate(.82) sepia(.14) brightness(1.03)',t:'rgba(255,190,120,.10)'},
  {name:'黑白',f:'grayscale(1) contrast(1.12)',t:null},
  {name:'黑金',f:'grayscale(1) sepia(.55) contrast(1.15) brightness(1.04)',t:null},
  {name:'复古',f:'sepia(.42) saturate(.85) contrast(.96) brightness(1.05)',t:null},
  {name:'冷调',f:'saturate(1.12) brightness(1.05) contrast(1.03)',t:'rgba(70,140,255,.14)'},
  {name:'暖阳',f:'sepia(.22) saturate(1.22) brightness(1.05)',t:'rgba(255,150,60,.14)'},
];
function buildFilterThumbs(){
  const box=$('#filterThumbs');box.innerHTML='';
  PRESETS.forEach((p,i)=>{
    const d=document.createElement('div');d.className='thumb'+(i===S.filterIdx?' on':'');
    d.innerHTML=`<div class="im"><img src="${thumbURL}" style="filter:${p.f}">${p.t?`<div class="tt" style="background:${p.t}"></div>`:''}</div><span>${p.name}</span>`;
    d.onclick=()=>{
      S.filterIdx=i;
      $$('#filterThumbs .thumb').forEach((el,j)=>el.classList.toggle('on',j===i));
      cv.style.filter=p.f||'none';
      S.filterTint=p.t;updateWarm(p.t);
    };
    box.appendChild(d);
  });
}
function openFilter(){
  S.filterSave=S.filterIdx;S.filterTint=null;
  S.filterIdx=0;
  if(!thumbURL){
    const t=makeCanvas(160,160),g=t.getContext('2d');
    const k=160/Math.max(S.W,S.H);
    g.drawImage(cv,0,0,S.W*k,S.H*k);
    thumbURL=t.toDataURL('image/jpeg',.8);
  }
  buildFilterThumbs();
  cv.style.filter='none';updateWarm(null);
}
function cancelFilter(){
  cv.style.filter='none';updateWarm(S.filterTint=null);
  S.filterIdx=S.filterSave;
}
function applyFilter(){
  const p=PRESETS[S.filterIdx];
  S.filterTint=null;
  if(!p.f&&!p.t){cv.style.filter='none';updateWarm(null);return}
  const nc=makeCanvas(S.W,S.H),g=nc.getContext('2d');
  if(typeof g.filter==='string')g.filter=p.f;
  g.drawImage(cv,0,0);g.filter='none';
  if(p.t){
    g.save();g.globalCompositeOperation='soft-light';
    g.fillStyle=p.t;g.fillRect(0,0,S.W,S.H);g.restore();
  }
  cv.width=S.W;cv.height=S.H;ctx.drawImage(nc,0,0);
  S.effect=null;cv.style.filter='none';updateWarm(null);
  thumbURL='';S.filterIdx=0;
  pushHistory();toast(`已应用「${p.name}」`);
}

/* ================= 文字 ================= */
function textShadowCSS(size,color){
  const r=Math.max(1,size*.05), r2=r*2;
  const dirs=[[r,0],[-r,0],[0,r],[0,-r],[r,r],[-r,-r],[r,-r],[-r,r],[r2,0],[-r2,0],[0,r2],[0,-r2]];
  return dirs.map(([x,y])=>`0 0 ${x}px ${y}px ${color}`).join(',');
}
function makeTextObj(x,y){
  return {id:S.seq++,text:'双击编辑',x,y,size:.08,color:'#FFFFFF',font:0,stroke:true,rot:0};
}
function renderTextObj(t){
  let el=document.getElementById('tobj'+t.id);
  if(!el){
    el=document.createElement('div');
    el.className='text-obj';el.id='tobj'+t.id;
    el.innerHTML=`<div class="t-body"></div>
      <button class="t-btn t-del"><svg width="16" height="16"><use href="#i-trash"/></svg></button>
      <button class="t-btn t-resize"><svg width="15" height="15"><use href="#i-resize"/></svg></button>`;
    textLayer.appendChild(el);
    bindTextEvents(t,el);
  }
  const px=t.size*wrap.clientWidth;
  el.style.left=t.x*100+'%';el.style.top=t.y*100+'%';
  el.style.fontSize=px+'px';
  el.style.fontFamily=FONTS[t.font];
  el.style.transform=`translate(-50%,-50%) rotate(${t.rot}deg)`;
  const body=el.querySelector('.t-body');
  body.textContent=t.text;
  body.style.color=t.color;
  body.style.textShadow=t.stroke?textShadowCSS(px,t.color==='#000000'?'rgba(255,255,255,.9)':'rgba(0,0,0,.85)'):'none';
  el.classList.toggle('sel',S.sel===t.id);
}
function renderAllTexts(){
  textLayer.innerHTML='';
  S.texts.forEach(renderTextObj);
}
function refreshTexts(){S.texts.forEach(renderTextObj)}
function selectText(t){
  S.sel=t?t.id:null;
  S.texts.forEach(renderTextObj);
  updateTextPanel();
}
function deselectText(){selectText(null)}
function updateTextPanel(){
  const has=!!S.sel;
  $('#textCtlEmpty').style.display=has?'none':'flex';
  $('#textCtlSel').style.display=has?'flex':'none';
  $('#textMidBtns').style.display=has?'flex':'none';
  if(has){
    const t=S.texts.find(x=>x.id===S.sel);
    $$('#textDots .dot').forEach(d=>d.classList.toggle('on',d.dataset.c===t.color));
    $$('#pText .fontChip').forEach(c=>c.classList.toggle('on',+c.dataset.f===t.font));
    $('#textStroke').classList.toggle('on',t.stroke);
    $('#hint').style.display='none';
  }else if(S.mode==='text'){
    $('#hint').style.display='block';
  }
}
function bindTextEvents(t,el){
  // 拖动
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.t-btn'))return;
    e.stopPropagation();e.preventDefault();
    selectText(t);
    const r0=wrap.getBoundingClientRect();
    const sx=e.clientX,sy=e.clientY,o={x:t.x,y:t.y};
    const mv=ev=>{
      t.x=clamp(o.x+(ev.clientX-sx)/r0.width,-.05,1.05);
      t.y=clamp(o.y+(ev.clientY-sy)/r0.height,-.05,1.05);
      renderTextObj(t);
    };
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
  // 删除
  el.querySelector('.t-del').addEventListener('pointerdown',e=>{
    e.stopPropagation();
    S.texts=S.texts.filter(x=>x!==t);
    el.remove();S.sel=null;updateTextPanel();
    toast('已删除文字');
  });
  // 缩放手柄
  el.querySelector('.t-resize').addEventListener('pointerdown',e=>{
    e.stopPropagation();e.preventDefault();
    const r0=wrap.getBoundingClientRect();
    const c={x:r0.left+t.x*r0.width,y:r0.top+t.y*r0.height};
    const d0=Math.max(6,Math.hypot(e.clientX-c.x,e.clientY-c.y)),s0=t.size;
    const mv=ev=>{
      t.size=clamp(s0*Math.hypot(ev.clientX-c.x,ev.clientY-c.y)/d0,.015,.55);
      renderTextObj(t);
    };
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  });
  // 双击编辑
  let lastTapT=0;
  el.addEventListener('pointerup',e=>{
    if(e.target.closest('.t-btn'))return;
    const now=Date.now();
    if(now-lastTapT<320){openTextSheet(t);lastTapT=0}
    else lastTapT=now;
  });
}
/* 文字编辑 Sheet */
let sheetTarget=null, sheetIsNew=false, sheetSave=null;
function openTextSheet(t){
  sheetTarget=t;sheetIsNew=!S.texts.includes(t);
  sheetSave=sheetIsNew?null:{...t};
  if(sheetIsNew)S.texts.push(t);
  selectText(t);
  $('#tInput').value=t.text;
  $$('#sheetDots .dot').forEach(d=>d.classList.toggle('on',d.dataset.c===t.color));
  $$('#textSheet .fontChip').forEach(c=>c.classList.toggle('on',+c.dataset.f===t.font));
  $('#sheetStroke').classList.toggle('on',t.stroke);
  $('#textSheet').classList.add('show');
  setTimeout(()=>$('#tInput').focus(),120);
}
function closeTextSheet(commit){
  if(!sheetTarget)return;
  const t=sheetTarget;
  if(!commit){
    if(sheetIsNew){S.texts=S.texts.filter(x=>x!==t);const el=document.getElementById('tobj'+t.id);el&&el.remove()}
    else if(sheetSave)Object.assign(t,sheetSave);
  }else if(!t.text.trim()){
    if(sheetIsNew){S.texts=S.texts.filter(x=>x!==t);const el=document.getElementById('tobj'+t.id);el&&el.remove()}
  }
  sheetTarget=null;sheetSave=null;
  $('#textSheet').classList.remove('show');
  renderAllTexts();updateTextPanel();
  if(S.mode!=='text')setMode('none');
}
function addTextAt(xRatio,yRatio){
  const t=makeTextObj(clamp(xRatio,.08,.92),clamp(yRatio,.1,.9));
  renderTextObj(t);
  openTextSheet(t);
}

/* ================= 导出 ================= */
function composite(){
  const out=makeCanvas(S.W,S.H),g=out.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,S.W,S.H);
  g.drawImage(cv,0,0);
  S.texts.forEach(t=>{
    const fs=t.size*S.W;
    g.save();
    g.translate(t.x*S.W,t.y*S.H);
    g.rotate(t.rot*Math.PI/180);
    g.font=`600 ${fs}px ${FONTS[t.font]}`;
    g.textAlign='center';g.textBaseline='middle';
    const lines=String(t.text).split('\n');
    const lh=fs*1.22, y0=-(lines.length-1)*lh/2;
    if(t.stroke){
      g.fillStyle=t.color==='#000000'?'rgba(255,255,255,.9)':'rgba(0,0,0,.85)';
      const r=Math.max(1,fs*.05),r2=r*2;
      lines.forEach((ln,i)=>{
        const y=y0+i*lh;
        [[r,0],[-r,0],[0,r],[0,-r],[r,r],[-r,-r],[r,-r],[-r,r],[r2,0],[-r2,0],[0,r2],[0,-r2]]
          .forEach(([dx,dy])=>g.fillText(ln,dx,y+dy));
      });
    }
    g.fillStyle=t.color;
    lines.forEach((ln,i)=>g.fillText(ln,0,y0+i*lh));
    g.restore();
  });
  return out;
}
function download(blob){
  const a=document.createElement('a');
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  a.download=`照片_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  a.href=URL.createObjectURL(blob);
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function doExport(type){
  busy(true);
  composite().toBlob(b=>{
    busy(false);
    if(!b){toast('导出失败');return}
    download(b);
    hideExport();
    toast(type==='png'?'已存储 PNG':'已存储 JPEG');
  },type==='png'?'image/png':'image/jpeg',.92);
}
function showExport(){
  if(!S.ready)return;
  if(navigator.clipboard&&window.ClipboardItem)$('#expCopy').style.display='flex';
  $('#exportMask').classList.add('show');$('#exportSheet').classList.add('show');
}
function hideExport(){$('#exportMask').classList.remove('show');$('#exportSheet').classList.remove('show')}

/* ================= 指针交互（视图 / 绘制 / 轻点） ================= */
stage.addEventListener('pointerdown',e=>{
  if(!S.ready)return;
  if(e.target.closest('.text-obj')||e.target.closest('.ch')||e.target.closest('#cropBox'))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  if(ptrs.size===2&&S.mode!=='crop'){
    if(S.drawing)endStroke(),S.drawing=false;
    const [a,b]=[...ptrs.values()];
    pinch={d0:Math.hypot(a.x-b.x,a.y-b.y),s0:V.s,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,tx0:V.tx,ty0:V.ty};
    downInfo=null;
    return;
  }
  if(ptrs.size>1)return;
  downInfo={x:e.clientX,y:e.clientY,t:Date.now(),moved:false,lx:e.clientX,ly:e.clientY};
  if(S.mode==='brush'||S.mode==='retouch'){
    if(!cropLayer.contains(e.target)){
      S.drawing=true;lastPt=null;
      beginStroke(toCanvas(e.clientX,e.clientY),S.mode==='brush'?'brush':S.retouchTool);
    }
  }
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    const s=clamp(pinch.s0*d/pinch.d0,.6,5);
    setView(s,pinch.tx0+(cx-pinch.cx),pinch.ty0+(cy-pinch.cy));
    return;
  }
  if(!downInfo)return;
  const dx=e.clientX-downInfo.x, dy=e.clientY-downInfo.y;
  if(Math.hypot(dx,dy)>8)downInfo.moved=true;
  if(S.drawing){
    const p=toCanvas(e.clientX,e.clientY);
    moveStroke(p,S.mode==='brush'?'brush':S.retouchTool);
    lastPt=p;
  }else if(downInfo.moved&&(S.mode==='none'||S.mode==='text')&&!cropLayer.contains(e.target)){
    setView(V.s,V.tx+e.clientX-downInfo.lx,V.ty+e.clientY-downInfo.ly);
  }
  downInfo.lx=e.clientX;downInfo.ly=e.clientY;
});
function stageUp(e){
  if(!ptrs.has(e.pointerId))return;
  ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;downInfo=null;return}
  if(S.drawing){S.drawing=false;endStroke();downInfo=null;return}
  if(!downInfo)return;
  const tap=!downInfo.moved&&Date.now()-downInfo.t<400;
  const cx=downInfo.x,cy=downInfo.y;
  downInfo=null;
  if(!tap)return;
  // 双击复位视图
  const now=Date.now();
  if(now-lastTap<320&&Math.hypot(cx-lastTapXY[0],cy-lastTapXY[1])<36){
    lastTap=0;fitView();return;
  }
  lastTap=now;lastTapXY=[cx,cy];
  if(S.mode==='text'){
    const p=toCanvas(cx,cy);
    addTextAt(p.x/S.W,p.y/S.H);
  }else if(S.mode==='none'){
    deselectText();
  }
}
stage.addEventListener('pointerup',stageUp);
stage.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch=null;if(S.drawing){S.drawing=false;endStroke()}downInfo=null});
stage.addEventListener('wheel',e=>{
  if(!S.ready)return;
  e.preventDefault();
  setView(clamp(V.s*(e.deltaY<0?1.12:.89),.6,5),V.tx,V.ty);
},{passive:false});
